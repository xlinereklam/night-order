<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>HARRY'S | Menü</title>

<style>
:root{
    --bg:#070707;
    --bg2:#0d0d0d;
    --panel:#121212;
    --panel2:#181818;
    --gold:#d6b36a;
    --gold-light:#f0d79c;
    --text:#f4f1ea;
    --muted:#99958d;
    --line:rgba(214,179,106,.18);
    --danger:#d85c5c;
    --radius:18px;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    background:var(--bg);
}

body{
    margin:0;
    padding:0;
    background:
        radial-gradient(circle at 50% -10%, rgba(214,179,106,.13), transparent 35%),
        radial-gradient(circle at 0% 45%, rgba(214,179,106,.045), transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
}

button{
    font:inherit;
}

.app{
    width:100%;
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 120px;
}

/* =========================
   HEADER
========================= */

.hero{
    position:relative;
    text-align:center;
    padding:20px 10px 22px;
}

.hero::after{
    content:"";
    display:block;
    width:70px;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    margin:20px auto 0;
}

.logo{
    width:min(220px,70vw);
    max-height:100px;
    object-fit:contain;
    display:block;
    margin:0 auto 12px;
}

.brand-fallback{
    display:none;
    font-size:34px;
    font-weight:800;
    letter-spacing:5px;
    color:#fff;
}

.venue-label{
    font-size:10px;
    letter-spacing:4px;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:12px;
}

.table-badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:8px 13px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(255,255,255,.025);
    color:#d8d4cc;
    font-size:12px;
}

.table-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 10px rgba(214,179,106,.8);
}

/* =========================
   QUICK ACTION
========================= */

.quick-area{
    margin:4px 0 20px;
}

.quick-button{
    width:100%;
    border:1px solid rgba(214,179,106,.25);
    background:
        linear-gradient(135deg,rgba(214,179,106,.12),rgba(255,255,255,.025));
    color:var(--text);
    border-radius:16px;
    padding:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:.18s ease;
}

.quick-button:active{
    transform:scale(.98);
}

.quick-icon{
    color:var(--gold-light);
    font-size:18px;
}

/* =========================
   SECTION TITLE
========================= */

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:20px 2px 11px;
}

.section-title h2{
    font-size:15px;
    margin:0;
    font-weight:700;
    letter-spacing:.3px;
}

.section-title span{
    color:var(--muted);
    font-size:11px;
}

/* =========================
   CATEGORIES
========================= */

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 1px 10px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category-btn{
    flex:0 0 auto;
    border:1px solid rgba(255,255,255,.09);
    background:#111;
    color:#aaa;
    border-radius:999px;
    padding:10px 14px;
    font-size:12px;
    cursor:pointer;
    transition:.2s ease;
}

.category-btn.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#111;
    font-weight:700;
}

/* =========================
   PRODUCTS
========================= */

.products{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.product-card{
    display:flex;
    gap:13px;
    align-items:center;
    padding:11px;
    min-height:118px;
    border-radius:17px;
    background:
        linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
    border:1px solid rgba(255,255,255,.055);
    transition:.18s ease;
}

.product-card.has-cart{
    border-color:rgba(214,179,106,.34);
}

.product-image{
    width:96px;
    height:96px;
    flex:0 0 96px;
    border-radius:13px;
    overflow:hidden;
    background:
        radial-gradient(circle at center,rgba(214,179,106,.12),transparent 65%),
        #191919;
    display:flex;
    align-items:center;
    justify-content:center;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.product-image .no-image{
    color:#6e6b65;
    font-size:10px;
    text-align:center;
    letter-spacing:1px;
}

.product-info{
    min-width:0;
    flex:1;
}

.product-name{
    font-size:15px;
    font-weight:700;
    line-height:1.25;
    margin-bottom:5px;
}

.product-description{
    color:#8e8a83;
    font-size:11px;
    line-height:1.45;
    margin-bottom:8px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.product-price{
    color:var(--gold-light);
    font-weight:700;
    font-size:14px;
}

.product-actions{
    flex:0 0 auto;
}

.add-button{
    width:42px;
    height:42px;
    border:1px solid rgba(214,179,106,.35);
    background:rgba(214,179,106,.09);
    color:var(--gold-light);
    border-radius:12px;
    font-size:22px;
    line-height:1;
    cursor:pointer;
}

.add-button:active{
    transform:scale(.92);
}

.quantity-control{
    display:flex;
    align-items:center;
    gap:6px;
    padding:4px;
    border:1px solid rgba(214,179,106,.25);
    border-radius:12px;
    background:#0c0c0c;
}

.qty-button{
    width:30px;
    height:30px;
    border:0;
    border-radius:8px;
    background:#1b1b1b;
    color:#eee;
    cursor:pointer;
    font-size:18px;
}

.qty-number{
    min-width:20px;
    text-align:center;
    font-size:13px;
    font-weight:700;
}

/* =========================
   LOADING / EMPTY
========================= */

.loading,
.empty,
.error-box{
    text-align:center;
    padding:35px 15px;
    color:var(--muted);
    font-size:13px;
}

.error-box{
    border:1px solid rgba(216,92,92,.25);
    background:rgba(216,92,92,.05);
    border-radius:16px;
    color:#dca1a1;
}

.retry-button{
    margin-top:14px;
    border:1px solid var(--line);
    background:#161616;
    color:var(--gold-light);
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
}

/* =========================
   CART BAR
========================= */

.cart-bar{
    position:fixed;
    z-index:50;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    width:min(690px,calc(100% - 24px));
    padding:10px;
    border-radius:18px;
    background:rgba(17,17,17,.94);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(214,179,106,.25);
    box-shadow:0 15px 50px rgba(0,0,0,.5);
    display:none;
}

.cart-open{
    width:100%;
    border:0;
    background:var(--gold);
    color:#111;
    border-radius:13px;
    padding:14px 16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-weight:800;
}

.cart-summary{
    display:flex;
    align-items:center;
    gap:9px;
}

.cart-count{
    min-width:23px;
    height:23px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#111;
    color:var(--gold-light);
    font-size:11px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    align-items:flex-end;
    justify-content:center;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(720px,100%);
    max-height:88vh;
    overflow:auto;
    background:#101010;
    border:1px solid rgba(214,179,106,.18);
    border-radius:23px 23px 0 0;
    padding:18px 15px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -20px 70px rgba(0,0,0,.65);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

.modal-title{
    font-size:18px;
    font-weight:800;
}

.close-button{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#1c1c1c;
    color:#aaa;
    cursor:pointer;
    font-size:18px;
}

.cart-items{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px;
    border:1px solid rgba(255,255,255,.055);
    border-radius:13px;
    background:#151515;
}

.cart-item-info{
    min-width:0;
    flex:1;
}

.cart-item-name{
    font-size:13px;
    font-weight:700;
}

.cart-item-price{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.cart-item-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.cart-total{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:18px 2px;
    padding-top:15px;
    border-top:1px solid rgba(255,255,255,.08);
}

.cart-total-label{
    color:var(--muted);
    font-size:13px;
}

.cart-total-value{
    color:var(--gold-light);
    font-size:21px;
    font-weight:800;
}

/* =========================
   PAYMENT
========================= */

.payment-title{
    font-size:13px;
    font-weight:700;
    margin-bottom:9px;
}

.payment-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.payment-button{
    border:1px solid rgba(255,255,255,.08);
    background:#151515;
    color:#aaa;
    border-radius:12px;
    padding:12px;
    cursor:pointer;
}

.payment-button.active{
    border-color:var(--gold);
    background:rgba(214,179,106,.10);
    color:var(--gold-light);
}

.note-label{
    display:block;
    margin:16px 0 8px;
    font-size:13px;
    font-weight:700;
}

.note-input{
    width:100%;
    min-height:80px;
    resize:vertical;
    border:1px solid rgba(255,255,255,.08);
    border-radius:13px;
    background:#151515;
    color:#eee;
    padding:12px;
    outline:none;
}

.note-input:focus{
    border-color:rgba(214,179,106,.45);
}

.submit-order{
    width:100%;
    margin-top:14px;
    border:0;
    border-radius:14px;
    padding:15px;
    background:var(--gold);
    color:#111;
    font-weight:900;
    cursor:pointer;
}

.submit-order:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    margin-top:40px;
    padding:25px 10px 10px;
    border-top:1px solid rgba(255,255,255,.05);
    color:#66635e;
    font-size:10px;
    line-height:1.6;
}

.footer-logo{
    width:58px;
    max-height:28px;
    object-fit:contain;
    display:block;
    margin:9px auto 12px;
    opacity:.75;
}

.footer-button{
    display:inline-flex;
    align-items:center;
    gap:7px;
    text-decoration:none;
    color:#aaa;
    border:1px solid rgba(255,255,255,.08);
    background:#111;
    padding:8px 12px;
    border-radius:9px;
    margin-top:3px;
}

.footer-button strong{
    color:var(--gold-light);
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    z-index:200;
    left:50%;
    bottom:92px;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    background:#f1eee7;
    color:#111;
    padding:11px 15px;
    border-radius:11px;
    font-size:12px;
    font-weight:700;
    transition:.25s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){
    .app{
        padding-top:28px;
    }

    .product-card{
        padding:13px;
    }

    .product-image{
        width:105px;
        height:105px;
        flex-basis:105px;
    }
}
</style>
</head>

<body>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://qkevbwcwsbgftvgxgasy.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_l39-lwrk--GgVkKDFEoPIA_1pmKKPTu";


/* =========================================================
   URL TOKEN
========================================================= */

const params =
    new URLSearchParams(window.location.search);

const token =
    params.get("t");


/* =========================================================
   STATE
========================================================= */

let table = null;
let categories = [];
let products = [];

let activeCategory = null;

let cart = {};

let paymentMethod = "Nakit";

let orderLocked = false;


/* =========================================================
   ELEMENTS
========================================================= */

const tableText =
    document.getElementById("tableText");

const categoriesEl =
    document.getElementById("categories");

const productsEl =
    document.getElementById("products");

const cartBar =
    document.getElementById("cartBar");

const cartCountEl =
    document.getElementById("cartCount");

const cartBarTotalEl =
    document.getElementById("cartBarTotal");

const cartModal =
    document.getElementById("cartModal");

const cartItemsEl =
    document.getElementById("cartItems");

const cartTotalEl =
    document.getElementById("cartTotal");

const orderNoteEl =
    document.getElementById("orderNote");

const submitOrderButton =
    document.getElementById("submitOrderButton");

const toastEl =
    document.getElementById("toast");


/* =========================================================
   HELPERS
========================================================= */

function formatPrice(value){

    const number =
        Number(value || 0);

    return number.toLocaleString("tr-TR", {
        style:"currency",
        currency:"TRY"
    });

}


function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function showToast(message){

    toastEl.textContent =
        message;

    toastEl.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {

            toastEl.classList.remove("show");

        },2500);

}


/* =========================================================
   SUPABASE FETCH
========================================================= */

async function supabaseFetch(
    path,
    options = {}
){

    const response =
        await fetch(
            SUPABASE_URL + path,
            {
                ...options,

                headers:{
                    "apikey":
                        SUPABASE_ANON_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_ANON_KEY}`,

                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})
                }
            }
        );


    const text =
        await response.text();


    let data = null;


    try{

        data =
            text
                ? JSON.parse(text)
                : null;

    }catch{

        data =
            text;

    }


    if(!response.ok){

        const message =
            typeof data === "object" && data?.message
                ? data.message
                : typeof data === "object" && data?.details
                    ? data.details
                    : text || "Supabase hatası";

        throw new Error(message);

    }


    return data;

}


/* =========================================================
   LOAD TABLE
========================================================= */

async function loadTable(){

    if(!token){

        throw new Error(
            "Masa bağlantısı bulunamadı. QR/NFC bağlantısı geçersiz."
        );

    }


    const data =
        await supabaseFetch(
            `/rest/v1/tables?token=eq.${encodeURIComponent(token)}&active=eq.true&select=id,table_number,token`
        );


    if(!Array.isArray(data) || data.length === 0){

        throw new Error(
            "Masa bulunamadı veya masa pasif durumda."
        );

    }


    table =
        data[0];


    tableText.textContent =
        `Masa ${table.table_number}`;

}


/* =========================================================
   LOAD CATEGORIES
========================================================= */

async function loadCategories(){

    const data =
        await supabaseFetch(
            `/rest/v1/categories?active=eq.true&select=id,name,sort_order&order=sort_order.asc`
        );


    categories =
        Array.isArray(data)
            ? data
            : [];


    if(categories.length){

        activeCategory =
            String(categories[0].id);

    }


    renderCategories();

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

    const data =
        await supabaseFetch(
            `/rest/v1/products?active=eq.true&select=id,category_id,name,description,price,image_url,sort_order&order=sort_order.asc`
        );


    products =
        Array.isArray(data)
            ? data
            : [];


    renderProducts();

}


/* =========================================================
   CATEGORY RENDER
========================================================= */

function renderCategories(){

    categoriesEl.innerHTML = "";


    categories.forEach(category => {

        const button =
            document.createElement("button");

        button.type =
            "button";

        button.className =
            "category-btn";


        if(
            String(category.id) ===
            String(activeCategory)
        ){

            button.classList.add("active");

        }


        button.textContent =
            category.name;


        button.addEventListener(
            "click",
            () => {

                activeCategory =
                    String(category.id);

                renderCategories();

                renderProducts();

                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });

            }
        );


        categoriesEl.appendChild(button);

    });

}


/* =========================================================
   GET PRODUCT QUANTITY
========================================================= */

function getQuantity(productId){

    const key =
        String(productId);

    return cart[key]
        ? Number(cart[key].quantity || 0)
        : 0;

}


/* =========================================================
   PRODUCT RENDER
========================================================= */

function renderProducts(){

    productsEl.innerHTML = "";


    if(!products.length){

        productsEl.innerHTML =
            `<div class="empty">Menüde ürün bulunamadı.</div>`;

        return;

    }


    const filtered =
        products.filter(product => {

            if(activeCategory === null){

                return true;

            }

            return String(product.category_id) ===
                   String(activeCategory);

        });


    if(!filtered.length){

        productsEl.innerHTML =
            `<div class="empty">Bu kategoride ürün bulunamadı.</div>`;

        return;

    }


    filtered.forEach(product => {

        const quantity =
            getQuantity(product.id);


        const card =
            document.createElement("article");

        card.className =
            "product-card";


        if(quantity > 0){

            card.classList.add("has-cart");

        }


        /* IMAGE */

        const imageBox =
            document.createElement("div");

        imageBox.className =
            "product-image";


        if(product.image_url){

            const img =
                document.createElement("img");

            img.src =
                product.image_url;

            img.alt =
                product.name;

            img.loading =
                "lazy";


            img.onerror =
                function(){

                    this.style.display =
                        "none";

                    imageBox.innerHTML =
                        `<span class="no-image">HARRY'S</span>`;

                };


            imageBox.appendChild(img);

        }else{

            imageBox.innerHTML =
                `<span class="no-image">HARRY'S</span>`;

        }


        /* INFO */

        const info =
            document.createElement("div");

        info.className =
            "product-info";


        const name =
            document.createElement("div");

        name.className =
            "product-name";

        name.textContent =
            product.name;


        const description =
            document.createElement("div");

        description.className =
            "product-description";

        description.textContent =
            product.description || "";


        const price =
            document.createElement("div");

        price.className =
            "product-price";

        price.textContent =
            formatPrice(product.price);


        info.appendChild(name);

        if(product.description){

            info.appendChild(description);

        }

        info.appendChild(price);


        /* ACTION */

        const actions =
            document.createElement("div");

        actions.className =
            "product-actions";


        if(quantity > 0){

            const controls =
                document.createElement("div");

            controls.className =
                "quantity-control";


            const minus =
                document.createElement("button");

            minus.type =
                "button";

            minus.className =
                "qty-button";

            minus.textContent =
                "−";


            minus.addEventListener(
                "click",
                () => {

                    changeQuantity(
                        product.id,
                        -1
                    );

                }
            );


            const number =
                document.createElement("span");

            number.className =
                "qty-number";

            number.textContent =
                quantity;


            const plus =
                document.createElement("button");

            plus.type =
                "button";

            plus.className =
                "qty-button";

            plus.textContent =
                "+";


            plus.addEventListener(
                "click",
                () => {

                    changeQuantity(
                        product.id,
                        1
                    );

                }
            );


            controls.appendChild(minus);

            controls.appendChild(number);

            controls.appendChild(plus);

            actions.appendChild(controls);

        }else{

            const add =
                document.createElement("button");

            add.type =
                "button";

            add.className =
                "add-button";

            add.textContent =
                "+";


            add.addEventListener(
                "click",
                () => {

                    changeQuantity(
                        product.id,
                        1
                    );

                }
            );


            actions.appendChild(add);

        }


        card.appendChild(imageBox);

        card.appendChild(info);

        card.appendChild(actions);


        productsEl.appendChild(card);

    });

}


/* =========================================================
   CHANGE QUANTITY
========================================================= */

function changeQuantity(
    productId,
    amount
){

    const key =
        String(productId);


    const product =
        products.find(
            item =>
                String(item.id) === key
        );


    if(!product){

        console.error(
            "Ürün bulunamadı:",
            productId
        );

        return;

    }


    const current =
        getQuantity(productId);


    const next =
        current + Number(amount);


    if(next <= 0){

        delete cart[key];

    }else{

        cart[key] = {

            product_id:
                product.id,

            product_name:
                product.name,

            quantity:
                next,

            unit_price:
                Number(product.price || 0),

            total:
                next *
                Number(product.price || 0)

        };

    }


    renderProducts();

    renderCartBar();

}


/* =========================================================
   CART TOTAL
========================================================= */

function getCartItems(){

    return Object.values(cart);

}


function getCartCount(){

    return getCartItems()
        .reduce(
            (sum,item) =>
                sum + Number(item.quantity || 0),
            0
        );

}


function getCartTotal(){

    return getCartItems()
        .reduce(
            (sum,item) =>
                sum + Number(item.total || 0),
            0
        );

}


/* =========================================================
   CART BAR
========================================================= */

function renderCartBar(){

    const count =
        getCartCount();

    const total =
        getCartTotal();


    if(count <= 0){

        cartBar.style.display =
            "none";

        return;

    }


    cartBar.style.display =
        "block";


    cartCountEl.textContent =
        count;


    cartBarTotalEl.textContent =
        formatPrice(total);

}


/* =========================================================
   CART MODAL
========================================================= */

function openCart(){

    renderCart();

    cartModal.classList.add("show");

    document.body.style.overflow =
        "hidden";

}


function closeCart(){

    cartModal.classList.remove("show");

    document.body.style.overflow =
        "";

}


function renderCart(){

    cartItemsEl.innerHTML = "";


    const items =
        getCartItems();


    if(!items.length){

        cartItemsEl.innerHTML =
            `<div class="empty">Sepetin boş.</div>`;

        cartTotalEl.textContent =
            formatPrice(0);

        return;

    }


    items.forEach(item => {

        const row =
            document.createElement("div");

        row.className =
            "cart-item";


        const info =
            document.createElement("div");

        info.className =
            "cart-item-info";


        const name =
            document.createElement("div");

        name.className =
            "cart-item-name";

        name.textContent =
            item.product_name;


        const price =
            document.createElement("div");

        price.className =
            "cart-item-price";

        price.textContent =
            `${formatPrice(item.unit_price)} × ${item.quantity}`;


        info.appendChild(name);

        info.appendChild(price);


        const right =
            document.createElement("div");

        right.className =
            "cart-item-right";


        const minus =
            document.createElement("button");

        minus.type =
            "button";

        minus.className =
            "qty-button";

        minus.textContent =
            "−";


        minus.addEventListener(
            "click",
            () => {

                changeQuantity(
                    item.product_id,
                    -1
                );

                renderCart();

            }
        );


        const quantity =
            document.createElement("span");

        quantity.className =
            "qty-number";

        quantity.textContent =
            item.quantity;


        const plus =
            document.createElement("button");

        plus.type =
            "button";

        plus.className =
            "qty-button";

        plus.textContent =
            "+";


        plus.addEventListener(
            "click",
            () => {

                changeQuantity(
                    item.product_id,
                    1
                );

                renderCart();

            }
        );


        right.appendChild(minus);

        right.appendChild(quantity);

        right.appendChild(plus);


        row.appendChild(info);

        row.appendChild(right);


        cartItemsEl.appendChild(row);

    });


    cartTotalEl.textContent =
        formatPrice(
            getCartTotal()
        );

}


/* =========================================================
   PAYMENT BUTTONS
========================================================= */

document
    .querySelectorAll(".payment-button")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                paymentMethod =
                    button.dataset.payment;


                document
                    .querySelectorAll(".payment-button")
                    .forEach(btn => {

                        btn.classList.remove("active");

                    });


                button.classList.add("active");

            }
        );

    });


/* =========================================================
   SEND ORDER
========================================================= */

async function submitOrder(){

    if(orderLocked){

        return;

    }


    const items =
        getCartItems();


    if(!items.length){

        showToast(
            "Sepetin boş."
        );

        return;

    }


    if(!table){

        showToast(
            "Masa bağlantısı bulunamadı."
        );

        return;

    }


    orderLocked =
        true;

    submitOrderButton.disabled =
        true;

    submitOrderButton.textContent =
        "Sipariş gönderiliyor...";


    try{

        const total =
            getCartTotal();


        const note =
            orderNoteEl.value.trim();


        /* CREATE ORDER */

        const orderData =
            await supabaseFetch(
                "/rest/v1/orders",
                {
                    method:"POST",

                    headers:{
                        "Prefer":
                            "return=representation"
                    },

                    body:JSON.stringify({

                        table_id:
                            table.id,

                        status:
                            "pending",

                        payment_method:
                            paymentMethod,

                        note:
                            note || null,

                        total:
                            total

                    })
                }
            );


        const order =
            Array.isArray(orderData)
                ? orderData[0]
                : orderData;


        if(!order || !order.id){

            throw new Error(
                "Sipariş oluşturuldu ancak sipariş numarası alınamadı."
            );

        }


        /* CREATE ORDER ITEMS */

        const orderItems =
            items.map(item => ({

                order_id:
                    order.id,

                product_id:
                    item.product_id,

                product_name:
                    item.product_name,

                quantity:
                    item.quantity,

                unit_price:
                    item.unit_price,

                total:
                    item.total

            }));


        await supabaseFetch(
            "/rest/v1/order_items",
            {
                method:"POST",

                body:
                    JSON.stringify(orderItems)
            }
        );


        /* SUCCESS */

        cart = {};

        orderNoteEl.value =
            "";

        renderProducts();

        renderCartBar();

        closeCart();


        showToast(
            "Siparişin başarıyla gönderildi."
        );


    }catch(error){

        console.error(
            "SİPARİŞ HATASI:",
            error
        );


        showToast(
            "Sipariş gönderilemedi: " +
            error.message
        );


    }finally{

        orderLocked =
            false;

        submitOrderButton.disabled =
            false;

        submitOrderButton.textContent =
            "Siparişi Gönder";

    }

}

   WAITER
========================================================= */

    );

}


/* =========================================================

document

document
    .getElementById("closeCartButton")

    .getElementById("submitOrderButton")

cartModal.addEventListener(

        }

    }
);


/* =========================================================
   START
========================================================= */

async function startApp(){

    try{

        tableText.textContent =
            "Masa bağlantısı kuruluyor...";


        await loadTable();

        await loadCategories();

        await loadProducts();


    }catch(error){

        console.error(
            "UYGULAMA HATASI:",
            error
        );


        tableText.textContent =
            "Bağlantı hatası";


        productsEl.innerHTML = `

            <div class="error-box">

                <strong>Menü yüklenemedi.</strong>

                <br><br>

                ${escapeHtml(error.message)}

                <br>

                <button
                    type="button"
                    class="retry-button"
                    id="retryButton"
                >
                    Tekrar Dene
                </button>

            </div>

        `;


        document
            .getElementById("retryButton")
            .addEventListener(
                "click",
                () => {

                    window.location.reload();

                }
            );

    }

}


startApp();
