<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Night Order</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .logo {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 20px;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,0.4);
    }

    .loading {
      color: #aaa;
      font-size: 15px;
    }

    .label {
      color: #888;
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    .table-number {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .status {
      display: inline-block;
      background: #123d25;
      color: #5cff9a;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .message {
      color: #aaa;
      font-size: 14px;
      line-height: 1.6;
    }

    .error {
      color: #ff6b6b;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      NIGHT ORDER
    </div>

    <div class="card">

      <div id="content">
        <div class="loading">
          Masa bilgisi yükleniyor...
        </div>
      </div>

    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://qkevbwcwsbgftvgxgasy.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_l39-lwrk--GgVkKDFEoPIA_1pmKKPTu";


    /*
      MASA TOKENINI URL'DEN ALIYORUZ.

      Örnek:

      ?t=b8773255-8145-40c7-be0b-46612423745a
    */

    const params = new URLSearchParams(window.location.search);

    const token = params.get("t");


    async function loadTable() {

      const content = document.getElementById("content");


      if (!token) {

        content.innerHTML = `
          <div class="error">
            Masa bilgisi bulunamadı.
          </div>
        `;

        return;
      }


      try {

        const url =
          `${SUPABASE_URL}/rest/v1/tables` +
          `?token=eq.${encodeURIComponent(token)}` +
          `&active=eq.true` +
          `&select=table_number,token`;


        const response = await fetch(url, {

          method: "GET",

          headers: {

            "apikey": SUPABASE_ANON_KEY,

            "Authorization":
              `Bearer ${SUPABASE_ANON_KEY}`

          }

        });


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const data = await response.json();


        if (!data.length) {

          content.innerHTML = `
            <div class="error">
              Geçersiz veya pasif masa.
            </div>
          `;

          return;
        }


        const table = data[0];


        content.innerHTML = `

          <div class="label">
            HOŞ GELDİNİZ
          </div>

          <div class="table-number">
            MASA ${table.table_number}
          </div>

          <div class="status">
            ● Sipariş sistemi açık
          </div>

          <div class="message">
            Sistem bağlantısı başarılı.<br>
            Menü hazırlanıyor...
          </div>

        `;

      }


      catch (error) {

        console.error(error);

        content.innerHTML = `

          <div class="error">

            Sistem bağlantısında bir problem oluştu.

            <br><br>

            <small>
              ${error.message}
            </small>

          </div>

        `;

      }

    }


    loadTable();

  </script>

</body>
</html>
