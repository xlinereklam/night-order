<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>HARRY'S | Night Menu</title>

<style>

/* =====================================================
   HARRY'S NIGHT ORDER
   ===================================================== */

:root {
  --bg: #070707;
  --bg-soft: #0d0d0d;
  --card: #121212;
  --card-2: #181818;
  --line: rgba(255,255,255,.09);

  --text: #ffffff;
  --muted: #858585;
  --muted-2: #5f5f5f;

  --accent: #e21e2b;
  --accent-dark: #8e1018;

  --radius: 18px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(180, 20, 28, .25),
      transparent 38%
    ),
    radial-gradient(
      circle at 100% 35%,
      rgba(110, 0, 0, .10),
      transparent 30%
    ),
    #070707;

  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    Helvetica,
    sans-serif;

  -webkit-font-smoothing: antialiased;
}

button,
textarea {
  font-family: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

img {
  max-width: 100%;
}


/* =====================================================
   APP
===================================================== */

.app {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;

  min-height: 100vh;

  padding-bottom:
    calc(120px + env(safe-area-inset-bottom));
}


/* =====================================================
   HEADER
===================================================== */

.header {
  position: relative;

  padding:
    calc(24px + env(safe-area-inset-top))
    18px
    20px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,0)
    );

  border-bottom: 1px solid rgba(255,255,255,.06);
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 15px;
}

.brand-area {
  min-width: 0;
}

.brand-logo {
  display: block;

  width: 155px;
  max-height: 65px;

  object-fit: contain;
  object-position: left center;
}

.brand-fallback {
  display: none;

  font-size: 27px;
  font-weight: 900;

  letter-spacing: 4px;
}

.brand-sub {
  margin-top: 7px;

  color: #777;

  font-size: 9px;
  font-weight: 700;

  letter-spacing: 2.5px;

  text-transform: uppercase;
}

.table-badge {
  flex: 0 0 auto;

  display: flex;
  align-items: center;
  gap: 7px;

  padding: 9px 12px;

  border-radius: 999px;

  background: rgba(255,255,255,.045);

  border: 1px solid rgba(255,255,255,.10);

  color: #bbb;

  font-size: 10px;
  font-weight: 800;

  letter-spacing: .8px;

  white-space: nowrap;
}

.table-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #55e88a;

  box-shadow:
    0 0 10px rgba(85,232,138,.45);
}


/* =====================================================
   HERO
===================================================== */

.hero {
  position: relative;

  margin: 16px 14px 15px;

  min-height: 165px;

  overflow: hidden;

  border-radius: 24px;

  border: 1px solid rgba(255,255,255,.08);

  background:
    radial-gradient(
      circle at 85% 20%,
      rgba(226,30,43,.32),
      transparent 35%
    ),
    radial-gradient(
      circle at 20% 100%,
      rgba(255,255,255,.06),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #171717,
      #090909
    );

  box-shadow:
    0 20px 50px rgba(0,0,0,.35);
}

.hero::before {
  content: "";

  position: absolute;

  width: 180px;
  height: 180px;

  right: -70px;
  top: -70px;

  border-radius: 50%;

  background:
    rgba(226,30,43,.12);

  filter: blur(25px);
}

.hero::after {
  content: "";

  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      120deg,
      transparent 45%,
      rgba(255,255,255,.025) 50%,
      transparent 55%
    );

  pointer-events: none;
}

.hero-content {
  position: relative;

  z-index: 2;

  padding: 27px 23px;
}

.hero-kicker {
  color: #777;

  font-size: 9px;
  font-weight: 800;

  letter-spacing: 3px;

  text-transform: uppercase;
}

.hero-title {
  margin: 9px 0 0;

  font-size: 32px;
  line-height: .95;

  font-weight: 950;

  letter-spacing: -1.5px;
}

.hero-title span {
  color: var(--accent);
}

.hero-subtitle {
  max-width: 260px;

  margin-top: 12px;

  color: #8b8b8b;

  font-size: 12px;

  line-height: 1.5;
}

.hero-line {
  width: 38px;
  height: 3px;

  margin-top: 18px;

  border-radius: 10px;

  background: var(--accent);
}


/* =====================================================
   QUICK ACTION
===================================================== */

.quick-actions {
  padding: 0 14px 13px;
}

.quick-button {
  width: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  min-height: 50px;

  border: 1px solid rgba(255,255,255,.08);

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #181818,
      #101010
    );

  color: #fff;

  font-size: 11px;
  font-weight: 900;

  letter-spacing: 1.2px;

  cursor: pointer;

  box-shadow:
    0 10px 25px rgba(0,0,0,.18);

  transition:
    transform .15s ease,
    background .15s ease;
}

.quick-button:active {
  transform: scale(.98);
}

.quick-icon {
  margin-right: 8px;

  font-size: 16px;
}


/* =====================================================
   CATEGORIES
===================================================== */

.categories {
  position: sticky;

  top: 0;

  z-index: 30;

  display: flex;

  gap: 8px;

  overflow-x: auto;

  padding:
    11px 14px
    12px;

  background:
    rgba(7,7,7,.90);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border-top: 1px solid rgba(255,255,255,.04);
  border-bottom: 1px solid rgba(255,255,255,.06);

  scrollbar-width: none;
}

.categories::-webkit-scrollbar {
  display: none;
}

.category-btn {
  flex: 0 0 auto;

  padding: 9px 14px;

  border-radius: 999px;

  border: 1px solid rgba(255,255,255,.09);

  background: #111;

  color: #858585;

  font-size: 10px;
  font-weight: 850;

  letter-spacing: .7px;

  white-space: nowrap;

  cursor: pointer;

  transition:
    .15s ease;
}

.category-btn.active {
  background: #fff;

  border-color: #fff;

  color: #000;

  box-shadow:
    0 5px 18px rgba(255,255,255,.10);
}


/* =====================================================
   PRODUCTS
===================================================== */

.products {
  padding: 3px 14px;
}

.category-title {
  display: flex;
  align-items: baseline;

  margin:
    18px 3px
    12px;

  font-size: 23px;

  font-weight: 950;

  letter-spacing: -1px;
}

.category-count {
  margin-left: 8px;

  color: #555;

  font-size: 10px;

  font-weight: 600;

  letter-spacing: 0;
}


/* =====================================================
   PRODUCT CARD
===================================================== */

.product {
  position: relative;

  display: flex;
  align-items: center;

  gap: 13px;

  min-height: 108px;

  margin-bottom: 10px;

  padding: 10px;

  overflow: hidden;

  border-radius: var(--radius);

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  border: 1px solid rgba(255,255,255,.075);

  box-shadow:
    0 10px 25px rgba(0,0,0,.20);

  transition:
    transform .12s ease,
    border-color .12s ease;
}

.product:active {
  transform: scale(.988);

  border-color:
    rgba(255,255,255,.15);
}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

.product-image-wrap {
  width: 96px;
  height: 96px;

  flex: 0 0 96px;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  border-radius: 14px;

  background:
    radial-gradient(
      circle at 50% 35%,
      #292929,
      #101010 75%
    );

  border: 1px solid rgba(255,255,255,.08);
}

.product-image {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;

  transition:
    transform .25s ease;
}

.product:active .product-image {
  transform: scale(1.03);
}

.image-placeholder {
  font-size: 27px;

  opacity: .25;

  filter: grayscale(1);
}


/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info {
  min-width: 0;

  flex: 1;

  align-self: stretch;

  display: flex;
  flex-direction: column;

  justify-content: center;
}

.product-name {
  margin-bottom: 5px;

  color: #fff;

  font-size: 14px;
  line-height: 1.2;

  font-weight: 850;

  word-break: break-word;
}

.product-description {
  margin-bottom: 7px;

  color: #777;

  font-size: 10px;

  line-height: 1.4;

  display: -webkit-box;

  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;

  overflow: hidden;
}

.product-price {
  color: #fff;

  font-size: 14px;

  font-weight: 900;
}


/* =====================================================
   QUANTITY
===================================================== */

.quantity {
  flex: 0 0 auto;

  display: flex;
  align-items: center;

  gap: 6px;
}

.quantity button {
  width: 32px;
  height: 32px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  border: 1px solid rgba(255,255,255,.13);

  background: #202020;

  color: #fff;

  font-size: 18px;
  line-height: 1;

  cursor: pointer;

  transition:
    .12s ease;
}

.quantity button:last-child {
  background: #fff;

  color: #000;

  border-color: #fff;

  font-size: 20px;
}

.quantity button:active {
  transform: scale(.90);
}

.quantity span {
  min-width: 17px;

  text-align: center;

  color: #fff;

  font-size: 12px;

  font-weight: 900;
}


/* =====================================================
   CART BAR
===================================================== */

.cart-bar {
  position: fixed;

  left: 50%;

  bottom:
    calc(12px + env(safe-area-inset-bottom));

  transform:
    translateX(-50%);

  width:
    calc(100% - 24px);

  max-width: 650px;

  z-index: 80;
}

.cart-button {
  width: 100%;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 14px 15px 14px 17px;

  border: 1px solid rgba(255,255,255,.15);

  border-radius: 18px;

  background:
    rgba(245,245,245,.96);

  color: #000;

  cursor: pointer;

  box-shadow:
    0 18px 45px rgba(0,0,0,.65);

  backdrop-filter: blur(16px);
}

.cart-left {
  display: flex;
  align-items: center;

  gap: 9px;

  font-size: 12px;
  font-weight: 950;

  letter-spacing: .5px;
}

.cart-count {
  min-width: 23px;
  height: 23px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: #000;

  color: #fff;

  font-size: 10px;
}

.cart-total {
  font-size: 13px;

  font-weight: 950;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay {
  position: fixed;

  inset: 0;

  z-index: 150;

  display: none;

  align-items: flex-end;
  justify-content: center;

  background:
    rgba(0,0,0,.80);

  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

.overlay.show {
  display: flex;
}


/* =====================================================
   MODAL
===================================================== */

.modal {
  width: 100%;
  max-width: 680px;

  max-height: 92vh;

  overflow-y: auto;

  padding:
    13px 18px
    calc(28px + env(safe-area-inset-bottom));

  border-radius:
    25px 25px 0 0;

  border-top:
    1px solid rgba(255,255,255,.12);

  background:
    linear-gradient(
      180deg,
      #191919,
      #0d0d0d
    );

  box-shadow:
    0 -20px 60px rgba(0,0,0,.55);
}

.modal-handle {
  width: 38px;
  height: 4px;

  margin:
    0 auto
    17px;

  border-radius: 10px;

  background: #444;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 15px;
}

.modal-title {
  font-size: 21px;

  font-weight: 950;

  letter-spacing: -.5px;
}

.close {
  width: 35px;
  height: 35px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  border: 1px solid #333;

  background: #222;

  color: #fff;

  font-size: 20px;

  cursor: pointer;
}


/* =====================================================
   CART ITEMS
===================================================== */

.cart-item {
  display: flex;
  align-items: center;

  gap: 10px;

  padding: 13px 0;

  border-bottom:
    1px solid rgba(255,255,255,.07);
}

.cart-item-left {
  min-width: 0;

  flex: 1;
}

.cart-item-name {
  color: #fff;

  font-size: 13px;

  font-weight: 800;

  line-height: 1.35;
}

.cart-item-price {
  margin-top: 4px;

  color: #666;

  font-size: 10px;
}

.cart-item-controls {
  display: flex;
  align-items: center;

  gap: 6px;
}

.cart-item-controls button {
  width: 29px;
  height: 29px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  border: 1px solid #333;

  background: #202020;

  color: #fff;

  cursor: pointer;
}

.cart-item-qty {
  min-width: 17px;

  text-align: center;

  font-size: 12px;

  font-weight: 900;
}

.cart-item-total {
  min-width: 72px;

  text-align: right;

  color: #fff;

  font-size: 12px;

  font-weight: 850;
}


/* =====================================================
   TOTAL
===================================================== */

.total {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 19px 0;

  color: #fff;

  font-size: 18px;

  font-weight: 900;
}

.total span:last-child {
  font-size: 20px;
}


/* =====================================================
   FORM
===================================================== */

.section-label {
  margin:
    13px 0 8px;

  color: #6d6d6d;

  font-size: 9px;

  font-weight: 850;

  letter-spacing: 1.5px;

  text-transform: uppercase;
}

.payment-options {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 8px;
}

.payment-option {
  padding: 13px;

  border-radius: 13px;

  border: 1px solid #303030;

  background: #181818;

  color: #888;

  font-size: 12px;

  font-weight: 800;

  cursor: pointer;
}

.payment-option.active {
  background: #fff;

  color: #000;

  border-color: #fff;
}

textarea {
  width: 100%;

  min-height: 78px;

  resize: vertical;

  padding: 12px;

  outline: none;

  border-radius: 13px;

  border: 1px solid #303030;

  background: #181818;

  color: #fff;

  font-size: 12px;
}

textarea:focus {
  border-color: #666;
}


/* =====================================================
   ORDER BUTTON
===================================================== */

.order-button {
  width: 100%;

  margin-top: 14px;

  padding: 17px;

  border: 0;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #ddd
    );

  color: #000;

  font-size: 14px;

  font-weight: 950;

  letter-spacing: .5px;

  cursor: pointer;

  box-shadow:
    0 10px 25px rgba(0,0,0,.25);
}

.order-button:disabled {
  opacity: .45;
}


/* =====================================================
   MESSAGES
===================================================== */

.message {
  padding: 55px 20px;

  text-align: center;

  color: #666;

  font-size: 13px;

  line-height: 1.7;
}

.success {
  color: #61e995;
}

.error {
  color: #ff6c75;
}

.empty {
  padding: 45px 10px;

  text-align: center;

  color: #555;

  font-size: 12px;
}


/* =====================================================
   TOAST
===================================================== */

.toast {
  position: fixed;

  left: 50%;

  bottom: 92px;

  z-index: 250;

  width:
    calc(100% - 40px);

  max-width: 430px;

  padding: 13px 15px;

  border-radius: 14px;

  border: 1px solid #333;

  background:
    rgba(28,28,28,.96);

  color: #fff;

  text-align: center;

  font-size: 12px;

  font-weight: 750;

  opacity: 0;

  pointer-events: none;

  transform:
    translate(-50%, 15px);

  transition:
    .25s ease;
}

.toast.show {
  opacity: 1;

  transform:
    translate(-50%, 0);
}


/* =====================================================
   FOOTER
===================================================== */

.footer {
  padding:
    32px 20px
    calc(115px + env(safe-area-inset-bottom));

  text-align: center;

  color: #555;

  font-size: 9px;

  line-height: 1.7;
}

.footer-text {
  max-width: 290px;

  margin: 0 auto;
}

.footer-logo {
  display: block;

  width: 75px;
  max-height: 38px;

  margin:
    13px auto 11px;

  object-fit: contain;

  opacity: .62;
}

.footer-phone {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-width: 158px;

  padding: 10px 17px;

  border-radius: 999px;

  border: 1px solid rgba(255,255,255,.10);

  background: #111;

  color: #fff;

  text-decoration: none;

  font-size: 10px;

  font-weight: 800;

  letter-spacing: .5px;

  transition:
    .15s ease;
}

.footer-phone:active {
  transform: scale(.96);

  background: #1b1b1b;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 420px) {

  .brand-logo {
    width: 135px;
  }

  .hero {
    min-height: 150px;
  }

  .hero-title {
    font-size: 29px;
  }

  .product {
    gap: 10px;
    padding: 8px;
  }

  .product-image-wrap {
    width: 86px;
    height: 86px;

    flex-basis: 86px;
  }

  .product-name {
    font-size: 13px;
  }

  .product-description {
    font-size: 9px;
  }

  .quantity {
    gap: 4px;
  }

  .quantity button {
    width: 30px;
    height: 30px;
  }

}

@media (max-width: 350px) {

  .product-image-wrap {
    width: 76px;
    height: 76px;

    flex-basis: 76px;
  }

  .quantity button {
    width: 28px;
    height: 28px;
  }

  .table-badge {
    padding: 8px 9px;
  }

}

</style>
</head>

<body>

<div class="app">

<!-- ===================================================
     HEADER
=================================================== -->

<header class="header">

  <div class="header-top">

    <div class="brand-area">

      <img
        class="brand-logo"

  </div>

</header>


<!-- ===================================================
     HERO
=================================================== -->

<section class="hero">

  <div class="hero-content">

    <div class="hero-kicker">
      HARRY'S
    </div>

    <h1 class="hero-title">
      LET THE NIGHT<br>
      <span>BEGIN.</span>
    </h1>

    <div class="hero-subtitle">
      Menüyü keşfet, seçimini yap ve masandan sipariş ver.

<!-- ===================================================

=================================================== -->

  </button>

</div>


<!-- ===================================================
     CATEGORIES

<div
  class="categories"
  id="categories">
</div>


<!-- ===================================================
     PRODUCTS
=================================================== -->

<main
  class="products"
  id="products">

  <div class="message">
    Menü yükleniyor...
  </div>

</main>


<!-- ===================================================
     FOOTER
=================================================== -->

<footer class="footer">

  <div class="footer-text">
    Bu Yazılım XLine Reklam &amp; Yazılım
    Tarafından Oluşturulmuştur.<br>
    Detaylı Bilgi İçin
  </div>

  <img
    class="footer-logo"
    src="xline-logo.png"
    alt="XLine Reklam & Yazılım"
  >

  <a
    class="footer-phone"
    href="tel:05535964626">

    ☎ 0553 596 46 26

  </a>

</footer>

</div>


<!-- ===================================================
     CART BAR
=================================================== -->

<div class="cart-bar">

  <button
    class="cart-button"
    onclick="openCart()">

    <div class="cart-left">

      <span>
        SEPET
      </span>

      <span
        class="cart-count"
        id="cartCount">
        0
      </span>

    </div>

    <span
      class="cart-total"
      id="cartBarTotal">
      0,00 TL
    </span>

  </button>

</div>


<!-- ===================================================
     CART MODAL
=================================================== -->

<div
  class="overlay"
  id="cartOverlay"
  onclick="overlayClose(event)">

  <div class="modal">

    <div class="modal-handle"></div>


    <div class="modal-header">

      <div class="modal-title">
        Siparişiniz
      </div>

      <button
        class="close"
        onclick="closeCart()">

        ×

      </button>

    </div>


    <div id="cartItems"></div>


    <div class="total">

      <span>
        Toplam
      </span>

      <span id="cartTotal">
        0,00 TL
      </span>

    </div>


    <div class="section-label">
      Ödeme tercihi
    </div>


    <div class="payment-options">

      <button
        id="cashButton"
        class="payment-option active"
        onclick="selectPayment('cash')">

        Nakit

      </button>


      <button
        id="posButton"
        class="payment-option"
        onclick="selectPayment('pos')">

        POS Cihazı

      </button>

    </div>


    <div class="section-label">
      Sipariş notu
    </div>


    <textarea
      id="orderNote"
      maxlength="300"
      placeholder="Varsa siparişinizle ilgili özel bir not..."></textarea>


    <button
      id="orderButton"
      class="order-button"
      onclick="submitOrder()">

      SİPARİŞ VER

    </button>


    <div
      id="orderMessage"
      style="
        text-align:center;
        margin-top:14px;
        font-size:13px;
      ">
    </div>

  </div>

</div>


<!-- ===================================================
     TOAST
=================================================== -->

<div
  class="toast"
  id="toast">
</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://qkevbwcwsbgftvgxgasy.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_l39-lwrk--GgVkKDFEoPIA_1pmKKPTu";


/* =====================================================
   MASA TOKEN
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const token =
  params.get("t");


/* =====================================================
   APP STATE
===================================================== */

let table = null;

let categories = [];

let products = [];

let activeCategory = null;

let cart = {};

let paymentMethod = "cash";

let orderLocked = false;


/* =====================================================
   PRICE
===================================================== */

function formatPrice(price) {

  return Number(price).toLocaleString(
    "tr-TR",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  ) + " TL";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =====================================================
   LOAD TABLE
===================================================== */

async function loadTable() {

  if (!token) {

    document.getElementById("tableInfo")
      .innerHTML =
      `<span class="error">
        Masa bulunamadı
      </span>`;

    return false;

  }


  try {

    const url =
      `${SUPABASE_URL}/rest/v1/tables` +
      `?token=eq.${encodeURIComponent(token)}` +
      `&active=eq.true` +
      `&select=id,table_number,token`;


    const response =
      await fetch(
        url,
        {
          headers: {

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              `Bearer ${SUPABASE_ANON_KEY}`

          }
        }
      );


    if (!response.ok) {

      throw new Error(
        "Masa bağlantısı başarısız."
      );

    }


    const data =
      await response.json();


    if (!data.length) {

      throw new Error(
        "Geçersiz veya pasif masa."
      );

    }


    table =
      data[0];


    document.getElementById("tableInfo")
      .textContent =
      `MASA ${table.table_number}`;


    return true;

  }

  catch (error) {

    document.getElementById("tableInfo")
      .innerHTML =
      `<span class="error">
        ${escapeHtml(error.message)}
      </span>`;

    return false;

  }

}


/* =====================================================
   LOAD CATEGORIES
===================================================== */

async function loadCategories() {

  const url =
    `${SUPABASE_URL}/rest/v1/categories` +
    `?active=eq.true` +
    `&select=id,name,sort_order` +
    `&order=sort_order.asc`;


  const response =
    await fetch(
      url,
      {
        headers: {

          "apikey":
            SUPABASE_ANON_KEY,

          "Authorization":
            `Bearer ${SUPABASE_ANON_KEY}`

        }
      }
    );


  if (!response.ok) {

    throw new Error(
      "Kategoriler yüklenemedi."
    );

  }


  categories =
    await response.json();


  if (categories.length) {

    activeCategory =
      categories[0].id;

  }


  renderCategories();

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

  const url =
    `${SUPABASE_URL}/rest/v1/products` +
    `?active=eq.true` +
    `&select=id,category_id,name,description,price,image_url,sort_order` +
    `&order=sort_order.asc`;


  const response =
    await fetch(
      url,
      {
        headers: {

          "apikey":
            SUPABASE_ANON_KEY,

          "Authorization":
            `Bearer ${SUPABASE_ANON_KEY}`

        }
      }
    );


  if (!response.ok) {

    throw new Error(
      "Ürünler yüklenemedi."
    );

  }


  products =
    await response.json();


  renderProducts();

  updateCartCount();

}


/* =====================================================
   RENDER CATEGORIES
===================================================== */

function renderCategories() {

  const container =
    document.getElementById(
      "categories"
    );


  container.innerHTML = "";


  categories.forEach(category => {

    const button =
      document.createElement("button");


    button.className =
      "category-btn" +
      (
        category.id === activeCategory
          ? " active"
          : ""
      );


    button.textContent =
      category.name;


    button.onclick =
      function() {

        activeCategory =
          category.id;

        renderCategories();

        renderProducts();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      };


    container.appendChild(button);

  });

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts() {

  const container =
    document.getElementById(
      "products"
    );


  const filtered =
    products
      .filter(
        product =>
          product.category_id ===
          activeCategory
      )
      .sort(
        (a, b) =>
          Number(a.sort_order || 0) -
          Number(b.sort_order || 0)
      );


  if (!filtered.length) {

    container.innerHTML =
      `<div class="empty">
        Bu kategoride ürün bulunmuyor.
      </div>`;

    return;

  }


  const category =
    categories.find(
      c =>
        c.id === activeCategory
    );


  let html = `

    <div class="category-title">

      ${escapeHtml(
        category
          ? category.name
          : ""
      )}

      <span class="category-count">
        ${filtered.length} ürün
      </span>

    </div>

  `;


  filtered.forEach(product => {

    const quantity =
      cart[String(product.id)] || 0;


    const safeId =
      JSON.stringify(
        String(product.id)
      );


    const image =
      product.image_url
        ? `
          <img
            class="product-image"
            src="${escapeHtml(product.image_url)}"
            alt="${escapeHtml(product.name)}"
            loading="lazy"
            onerror="
              this.style.display='none';
              this.nextElementSibling.style.display='block';
            "
          >

          <span
            class="image-placeholder"
            style="display:none;">
            🍸
          </span>
        `
        : `
          <span class="image-placeholder">
            🍸
          </span>
        `;


    html += `

      <article class="product">

        <div class="product-image-wrap">

          ${image}

        </div>


        <div class="product-info">

          <div class="product-name">
            ${escapeHtml(product.name)}
          </div>


          ${
            product.description
              ? `
                <div class="product-description">
                  ${escapeHtml(
                    product.description
                  )}
                </div>
              `
              : ""
          }


          <div class="product-price">
            ${formatPrice(product.price)}
          </div>

        </div>


        <div class="quantity">

          <button
            aria-label="Azalt"
            onclick="changeQuantity(${safeId}, -1)">
            −
          </button>


          <span>
            ${quantity}
          </span>


          <button
            aria-label="Artır"
            onclick="changeQuantity(${safeId}, 1)">
            +
          </button>

        </div>

      </article>

    `;

  });


  container.innerHTML =
    html;

}


/* =====================================================
   QUANTITY
===================================================== */

function changeQuantity(
  productId,
  amount
) {

  const id =
    String(productId);


  const current =
    cart[id] || 0;


  const next =
    current + amount;


  if (next <= 0) {

    delete cart[id];

  } else {

    cart[id] =
      Math.min(
        next,
        99
      );

  }


  renderProducts();

  updateCartCount();

}


/* =====================================================
   CART DATA
===================================================== */

function getCartData() {

  const selected =
    products.filter(
      product =>
        cart[String(product.id)]
    );


  let total = 0;

  let count = 0;


  selected.forEach(product => {

    const quantity =
      cart[String(product.id)];


    count += quantity;


    total +=
      Number(product.price) *
      quantity;

  });


  return {
    selected,
    total,
    count
  };

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount() {

  const data =
    getCartData();


  document.getElementById(
    "cartCount"
  ).textContent =
    data.count;


  document.getElementById(
    "cartBarTotal"
  ).textContent =
    formatPrice(data.total);

}


/* =====================================================
   OPEN CART
===================================================== */

function openCart() {

  renderCart();


  document
    .getElementById(
      "cartOverlay"
    )
    .classList.add("show");


  document.body.style.overflow =
    "hidden";

}


/* =====================================================
   CLOSE CART
===================================================== */

function closeCart() {

  document
    .getElementById(
      "cartOverlay"
    )
    .classList.remove("show");


  document.body.style.overflow =
    "";

}


/* =====================================================
   OVERLAY CLOSE
===================================================== */

function overlayClose(event) {

  if (
    event.target.id ===
    "cartOverlay"
  ) {

    closeCart();

  }

}


/* =====================================================
   RENDER CART
===================================================== */

function renderCart() {

  const container =
    document.getElementById(
      "cartItems"
    );


  const data =
    getCartData();


  if (!data.selected.length) {

    container.innerHTML =
      `<div class="empty">
        Sepetiniz boş.
      </div>`;


    document.getElementById(
      "cartTotal"
    ).textContent =
      "0,00 TL";


    return;

  }


  let html = "";


  data.selected.forEach(product => {

    const id =
      String(product.id);


    const quantity =
      cart[id];


    const itemTotal =
      Number(product.price) *
      quantity;


    const safeId =
      JSON.stringify(id);


    html += `

      <div class="cart-item">

        <div class="cart-item-left">

          <div class="cart-item-name">
            ${escapeHtml(
              product.name
            )}
          </div>

          <div class="cart-item-price">
            ${formatPrice(
              product.price
            )} / adet
          </div>

        </div>


        <div class="cart-item-controls">

          <button
            onclick="
              changeQuantity(${safeId}, -1);
              renderCart();
            ">
            −
          </button>


          <span class="cart-item-qty">
            ${quantity}
          </span>


          <button
            onclick="
              changeQuantity(${safeId}, 1);
              renderCart();
            ">
            +
          </button>

        </div>


        <div class="cart-item-total">

          ${formatPrice(
            itemTotal
          )}

        </div>

      </div>

    `;

  });


  container.innerHTML =
    html;


  document.getElementById(
    "cartTotal"
  ).textContent =
    formatPrice(data.total);

}


/* =====================================================
   PAYMENT
===================================================== */

function selectPayment(method) {

  paymentMethod =
    method;


  document
    .getElementById(
      "cashButton"
    )
    .classList.toggle(
      "active",
      method === "cash"
    );


  document
    .getElementById(
      "posButton"
    )
    .classList.toggle(
      "active",
      method === "pos"
    );

}


/* =====================================================
   SUBMIT ORDER
===================================================== */

async function submitOrder() {

  if (orderLocked) {

    return;

  }


  const data =
    getCartData();


  if (!data.selected.length) {

    showOrderMessage(
      "Sepetiniz boş.",
      "error"
    );

    return;

  }


  if (!table) {

    showOrderMessage(
      "Masa bilgisi bulunamadı.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "orderButton"
    );


  orderLocked =
    true;


  button.disabled =
    true;


  button.textContent =
    "SİPARİŞ GÖNDERİLİYOR...";


  try {

    const items =
      data.selected.map(
        product => {

          const quantity =
            cart[String(product.id)];


          const itemTotal =
            Number(product.price) *
            quantity;


          return {

            product_id:
              product.id,

            product_name:
              product.name,

            quantity:
              quantity,

            unit_price:
              Number(
                product.price
              ),

            total:
              itemTotal

          };

        }
      );


    /* ---------------------------------------------
       ORDER
    --------------------------------------------- */

    const orderResponse =
      await fetch(
        `${SUPABASE_URL}/rest/v1/orders`,
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              `Bearer ${SUPABASE_ANON_KEY}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify({

              table_id:
                table.id,

              status:
                "pending",

              payment_method:
                paymentMethod,

              note:
                document
                  .getElementById(
                    "orderNote"
                  )
                  .value
                  .trim(),

              total:
                data.total

            })

        }
      );


    if (!orderResponse.ok) {

      const errorText =
        await orderResponse.text();


      throw new Error(
        `Sipariş oluşturulamadı: ${errorText}`
      );

    }


    const orderData =
      await orderResponse.json();


    const order =
      orderData[0];


    /* ---------------------------------------------
       ORDER ITEMS
    --------------------------------------------- */

    const itemResponse =
      await fetch(
        `${SUPABASE_URL}/rest/v1/order_items`,
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              `Bearer ${SUPABASE_ANON_KEY}`,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(

              items.map(
                item => ({

                  order_id:
                    order.id,

                  product_id:
                    item.product_id,

                  product_name:
                    item.product_name,

                  quantity:
                    item.quantity,

                  unit_price:
                    item.unit_price,

                  total:
                    item.total

                })
              )

            )

        }
      );


    if (!itemResponse.ok) {

      const errorText =
        await itemResponse.text();


      throw new Error(
        `Sipariş ürünleri kaydedilemedi: ${errorText}`
      );

    }


    /* ---------------------------------------------
       SUCCESS
    --------------------------------------------- */

    showOrderMessage(
      "Siparişiniz alınmıştır.",
      "success"
    );


    button.textContent =
      "SİPARİŞ ALINDI";


    cart = {};


    updateCartCount();

    renderProducts();


    document.getElementById(
      "orderNote"
    ).value = "";


    setTimeout(
      () => {

        closeCart();


        document.getElementById(
          "orderMessage"
        ).textContent = "";


        button.disabled =
          false;


        button.textContent =
          "SİPARİŞ VER";


        orderLocked =
          false;

      },
      2500
    );

  }

  catch (error) {

    console.error(error);


    showOrderMessage(
      error.message,
      "error"
    );


    setTimeout(
      () => {

        button.disabled =
          false;

        button.textContent =
          "SİPARİŞ VER";

        orderLocked =
          false;

      },
      5000
    );

  }

}


/* =====================================================
   ORDER MESSAGE
===================================================== */

function showOrderMessage(
  message,
  type
) {

  const element =
    document.getElementById(
      "orderMessage"
    );


  element.className =
    type === "success"
      ? "success"
      : "error";


  element.textContent =
    message;

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;


function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2600
    );

}


/* =====================================================
   SERVİS ÇAĞIR
===================================================== */

function callWaiter() {

  if (!table) {

    showToast(
      "Masa bilgisi bulunamadı."
    );

    return;

  }


  showToast(
    `Masa ${table.table_number} için servis ekibi çağrıldı.`
  );

}


/* =====================================================
   START APP
===================================================== */

async function startApp() {

  try {

    const tableLoaded =
      await loadTable();


    if (!tableLoaded) {

      document.getElementById(
        "products"
      ).innerHTML =
        `<div class="message error">
          Masa bağlantısı kurulamadı.
        </div>`;

      return;

    }


    await loadCategories();

    await loadProducts();

  }

  catch (error) {

    console.error(error);


    document.getElementById(
      "products"
    ).innerHTML =
      `<div class="message error">

        Menü yüklenirken bir hata oluştu.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>`;

  }

}


startApp();

</script>
